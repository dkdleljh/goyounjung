name: Deploy archive
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: dkdleljh/goyoonjung-wiki
          ref: main
          path: .wiki
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v6
        with:
          repository: dkdleljh/goyoonjung-wiki
          ref: main
          path: .wiki
          persist-credentials: false
      - name: Verify published source and every deployed artifact
        run: python3 .wiki/scripts/verify_website_sync.py --wait 900
