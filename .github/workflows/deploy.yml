name: Deploy archive
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.revision.outputs.changed }}
      wiki_revision: ${{ steps.revision.outputs.wiki_revision }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: dkdleljh/goyoonjung-wiki
          ref: main
          path: .wiki
          persist-credentials: false
      - name: Rebuild only when source revisions changed
        id: revision
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess, urllib.request
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          changed = True
          try:
              with urllib.request.urlopen('https://dkdleljh.github.io/goyounjung/sync.json', timeout=20) as response:
                  live = json.load(response)
              changed = live.get('revision') != git('-C', '.wiki', 'rev-parse', 'HEAD') or live.get('siteRevision') != git('rev-parse', 'HEAD')
          except Exception as exc:
              print('Rebuild required:', type(exc).__name__)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\n')
              output.write(f"wiki_revision={git('-C', '.wiki', 'rev-parse', 'HEAD')}\n")
          PYCODE
      - uses: actions/setup-node@v6
        if: steps.revision.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.revision.outputs.changed == 'true'
      - run: npm test
        if: steps.revision.outputs.changed == 'true'
      - run: npm run test:future-work
        if: steps.revision.outputs.changed == 'true'
      - run: npm run build
        if: steps.revision.outputs.changed == 'true'
      - run: npm run check:links
        if: steps.revision.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.revision.outputs.changed == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v6
        with:
          repository: dkdleljh/goyoonjung-wiki
          ref: ${{ needs.build.outputs.wiki_revision }}
          path: .wiki
          persist-credentials: false
      - name: Verify the built snapshot and every deployed artifact
        env:
          WIKI_REVISION: ${{ needs.build.outputs.wiki_revision }}
          SITE_REVISION: ${{ github.sha }}
        run: >-
          python3 .wiki/scripts/verify_website_sync.py --wait 900 --artifact-urls
          --wiki-revision "$WIKI_REVISION" --site-revision "$SITE_REVISION"
